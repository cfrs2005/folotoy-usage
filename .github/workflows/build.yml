name: Build FoloToy Usage
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: ./tools/validate.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: folotoy-usage
          path: build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error
